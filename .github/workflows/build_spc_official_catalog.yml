name: Build SPC Official HREF Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: spc-official-href
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Build SPC official catalog
        run: python scripts/build_spc_official_catalog.py

      - name: Commit updated SPC official catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/spc_official_catalog.json
          git diff --cached --quiet && echo "No SPC official catalog changes" || git commit -m "Update SPC official HREF catalog"
          git push
