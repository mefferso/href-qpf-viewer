name: Update HREF QPF Viewer

on:
  workflow_dispatch:
  schedule:
    # Runs every 2 hours, intentionally not near the top of the hour.
    - cron: '37 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build HREF QPF data files
        run: python scripts/build_href_qpf.py

      - name: Commit updated website/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update HREF QPF viewer data"
          git push
