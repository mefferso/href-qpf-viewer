name: Update HREF QPF Viewer

on:
  workflow_dispatch:
  schedule:
    # Runs every 2 hours, intentionally not near the top of the hour.
    - cron: '37 */2 * * *'

permissions:
  contents: write

concurrency:
  group: href-qpf-viewer-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install system packages
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python packages
        timeout-minutes: 12
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build HREF QPF data files
        timeout-minutes: 35
        env:
          HREF_MAX_RUNTIME_SECONDS: '2100'
          HREF_CONNECT_TIMEOUT_SECONDS: '10'
          HREF_READ_TIMEOUT_SECONDS: '60'
        run: python scripts/build_href_qpf_spc.py

      - name: Commit updated website/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update HREF QPF viewer data"
          git push
