<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HREF QPF Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--panel:rgba(13,17,23,.93);--panel2:rgba(22,27,34,.96);--text:#e6edf3;--muted:#9aa4b2;--line:rgba(255,255,255,.13);--danger:#ff7b72}
html,body,#map{height:100%;width:100%;margin:0;padding:0;overflow:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#11141a;color:var(--text)}#map{position:fixed;inset:0;background:#11141a}.leaflet-container{background:#11141a!important}.top-panel,.readout,.legend,.loading{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}.top-panel{top:14px;left:14px;width:min(440px,calc(100vw - 28px))}.header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(47,129,247,.28),rgba(13,17,23,0))}.title{font-size:18px;font-weight:800;line-height:1.15}.subtitle{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 14px}.control.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}select,input[type=range],button{width:100%;box-sizing:border-box}select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;outline:none}button{cursor:pointer;font-weight:700}.status{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.45}.status strong{color:var(--text)}.readout{right:14px;top:14px;width:min(330px,calc(100vw - 28px))}.readout .box{padding:13px 15px}.big-number{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff}.readout-detail{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5}.legend{right:14px;bottom:24px;width:min(330px,calc(100vw - 28px));padding:12px 14px}.legend-title{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.08em;margin-bottom:8px}.legend-row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px;font-size:12px;margin:4px 0}.swatch{height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}.loading{z-index:2000;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-weight:800}.hidden{display:none}@media(max-width:760px){.readout{top:auto;bottom:24px}.legend{display:none}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading" class="loading">Loading HREF QPF...</div>
<section class="top-panel">
  <div class="header"><div class="title">HREF QPF Viewer</div><div class="subtitle">Zoomable, clickable HREF ensemble precipitation guidance. Click the map to sample the nearest grid point.</div></div>
  <div class="controls">
    <div class="control full"><label for="layerSelect">Layer</label><select id="layerSelect"></select></div>
    <div class="control"><label for="productSelect">Product</label><select id="productSelect"></select></div>
    <div class="control"><label for="accumSelect">Accumulation</label><select id="accumSelect"></select></div>
    <div class="control"><label for="fhourSelect">Forecast hour</label><select id="fhourSelect"></select></div>
    <div class="control"><label for="displaySelect">Display</label><select id="displaySelect"><option value="smooth" selected>Smooth / SPC-ish</option><option value="grid">Grid cells</option></select></div>
    <div class="control"><label for="opacitySlider">Opacity</label><input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="0.82" /></div>
    <div class="control full"><button id="fitBtn">Fit map to data domain</button></div>
  </div>
  <div id="status" class="status">Waiting on data catalog...</div>
</section>
<section class="readout"><div class="box"><div class="big-number" id="sampleValue">-</div><div class="readout-detail" id="sampleDetail">Click the map for a QPF value.</div></div></section>
<section class="legend"><div class="legend-title">QPF inches</div><div id="legendRows"></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const state={catalog:null,activeLayer:null,activeGrid:null,opacity:.82,displayMode:'smooth'};
const els={loading:loading,layerSelect:layerSelect,productSelect:productSelect,accumSelect:accumSelect,fhourSelect:fhourSelect,displaySelect:displaySelect,opacitySlider:opacitySlider,fitBtn:fitBtn,status:status,sampleValue:sampleValue,sampleDetail:sampleDetail,legendRows:legendRows};
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([30.1,-90.2],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png',{maxZoom:18,subdomains:'abcd',attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
function colorForValue(v){for(const b of state.catalog?.colorScale||[]){if(v>=b.min&&v<b.max)return b.color}return null}
class QpfCanvasLayer extends L.Layer{
 onAdd(map){this._map=map;this._canvas=L.DomUtil.create('canvas','leaflet-qpf-layer');this._canvas.style.position='absolute';this._canvas.style.pointerEvents='none';this._canvas.style.zIndex='450';this._ctx=this._canvas.getContext('2d',{alpha:true});this._scratch=document.createElement('canvas');this._sctx=this._scratch.getContext('2d',{alpha:true});map.getPanes().overlayPane.appendChild(this._canvas);map.on('moveend zoomend resize viewreset',this.redraw,this);this.redraw()}
 onRemove(map){map.off('moveend zoomend resize viewreset',this.redraw,this);L.DomUtil.remove(this._canvas)}
 prep(size,dpr){const tl=this._map.containerPointToLayerPoint([0,0]);L.DomUtil.setPosition(this._canvas,tl);this._canvas.width=size.x*dpr;this._canvas.height=size.y*dpr;this._canvas.style.width=size.x+'px';this._canvas.style.height=size.y+'px';this._ctx.setTransform(dpr,0,0,dpr,0,0);this._ctx.clearRect(0,0,size.x,size.y)}
 drawGrid(size,exactPx,grid){const px=Math.ceil(exactPx)+1,half=exactPx/2;this._ctx.globalAlpha=state.opacity;for(let i=0;i<grid.value.length;i++){const v=grid.value[i];if(!Number.isFinite(v)||v<.001)continue;const c=colorForValue(v);if(!c)continue;const p=this._map.latLngToContainerPoint([grid.lat[i],grid.lon[i]]);if(p.x<-20||p.y<-20||p.x>size.x+20||p.y>size.y+20)continue;this._ctx.fillStyle=c;this._ctx.fillRect(p.x-half,p.y-half,px,px)}this._ctx.globalAlpha=1}
 drawSmooth(size,dpr,exactPx,grid){const sc=this._scratch,ctx=this._sctx;sc.width=size.x*dpr;sc.height=size.y*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size.x,size.y);ctx.globalAlpha=.95;const radius=Math.max(6,exactPx*1.65),blurPx=Math.max(2.5,Math.min(12,exactPx*.85));for(let i=0;i<grid.value.length;i++){const v=grid.value[i];if(!Number.isFinite(v)||v<.001)continue;const c=colorForValue(v);if(!c)continue;const p=this._map.latLngToContainerPoint([grid.lat[i],grid.lon[i]]);if(p.x<-radius*2||p.y<-radius*2||p.x>size.x+radius*2||p.y>size.y+radius*2)continue;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);g.addColorStop(0,c);g.addColorStop(.72,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;this._ctx.save();this._ctx.globalAlpha=state.opacity;this._ctx.imageSmoothingEnabled=true;this._ctx.filter='blur('+blurPx+'px)';this._ctx.drawImage(sc,0,0,size.x,size.y);this._ctx.restore();this._ctx.save();this._ctx.globalAlpha=Math.min(1,state.opacity*.38);const cr=Math.max(2.5,exactPx*.48);for(let i=0;i<grid.value.length;i++){const v=grid.value[i];if(!Number.isFinite(v)||v<1)continue;const c=colorForValue(v);if(!c)continue;const p=this._map.latLngToContainerPoint([grid.lat[i],grid.lon[i]]);if(p.x<-20||p.y<-20||p.x>size.x+20||p.y>size.y+20)continue;this._ctx.fillStyle=c;this._ctx.beginPath();this._ctx.arc(p.x,p.y,cr,0,Math.PI*2);this._ctx.fill()}this._ctx.restore()}
 redraw(){if(!this._map||!this._canvas||!state.activeGrid)return;const size=this._map.getSize(),dpr=window.devicePixelRatio||1;this.prep(size,dpr);const exactPx=4.5*Math.pow(2,this._map.getZoom()-6);if(state.displayMode==='grid')this.drawGrid(size,exactPx,state.activeGrid);else this.drawSmooth(size,dpr,exactPx,state.activeGrid)}
}
const qpfLayer=new QpfCanvasLayer().addTo(map);
function uniqueSorted(arr,numeric=false){const vals=Array.from(new Set(arr.filter(v=>v!==null&&v!==undefined)));vals.sort((a,b)=>numeric?Number(a)-Number(b):String(a).localeCompare(String(b)));return vals}
function layerLabel(layer){const valid=layer.validTimeUTC?new Date(layer.validTimeUTC).toISOString().slice(0,16).replace('T',' ')+'Z':'valid time unknown';return `${layer.runLabel} - ${layer.productLabel} - ${layer.accumHours}h QPF - F${String(layer.forecastHour).padStart(2,'0')} - ${valid}`}
function fillSelect(select,values,labeler=v=>v,selected=null){select.innerHTML='';for(const v of values){const opt=document.createElement('option');opt.value=String(v);opt.textContent=labeler(v);if(selected!==null&&String(v)===String(selected))opt.selected=true;select.appendChild(opt)}}
function populateControls(){const layers=state.catalog.layers||[];fillSelect(els.layerSelect,layers.map(l=>l.id),id=>layerLabel(layers.find(l=>l.id===id)));fillSelect(els.productSelect,uniqueSorted(layers.map(l=>l.product)),code=>layers.find(l=>l.product===code)?.productLabel||code);fillSelect(els.accumSelect,uniqueSorted(layers.map(l=>l.accumHours),true),h=>`${h} hours`);fillSelect(els.fhourSelect,uniqueSorted(layers.map(l=>l.forecastHour),true),h=>`F${String(h).padStart(2,'0')}`)}
function syncFilterControls(layer){els.productSelect.value=layer.product;els.accumSelect.value=String(layer.accumHours);els.fhourSelect.value=String(layer.forecastHour);els.layerSelect.value=layer.id}
async function loadMaybeGzipJson(url){const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status} for ${url}`);if(url.endsWith('.gz')){if(!('DecompressionStream'in window))throw new Error('This browser cannot read gzip data files. Use current Chrome/Edge.');const ds=new DecompressionStream('gzip');const text=await new Response(res.body.pipeThrough(ds)).text();return JSON.parse(text)}return await res.json()}
async function setActiveLayer(layerId){const layer=state.catalog.layers.find(l=>l.id===layerId);if(!layer)return;els.loading.classList.remove('hidden');els.status.innerHTML=`Loading <strong>${layerLabel(layer)}</strong>...`;try{const grid=await loadMaybeGzipJson(layer.url);state.activeLayer=layer;state.activeGrid=grid;syncFilterControls(layer);qpfLayer.redraw();els.status.innerHTML=`<strong>${layerLabel(layer)}</strong><br>${layer.pointCount.toLocaleString()} grid points. Layer max: ${layer.maxValue.toFixed(2)} in.`;els.sampleValue.textContent='-';els.sampleDetail.textContent='Click the map for a QPF value.'}catch(err){console.error(err);els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">Could not load layer.</span><br>${err.message}`}finally{els.loading.classList.add('hidden')}}
function chooseLayerFromFilters(){const product=els.productSelect.value,accum=Number(els.accumSelect.value),fhour=Number(els.fhourSelect.value);const layer=state.catalog.layers.find(l=>l.product===product&&l.accumHours===accum&&l.forecastHour===fhour);if(layer)setActiveLayer(layer.id);else els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">No exact layer for that combo.</span><br>Try a different accumulation or forecast hour.`}
function drawLegend(){els.legendRows.innerHTML='';for(const b of state.catalog.colorScale||[]){const row=document.createElement('div');row.className='legend-row';row.innerHTML=`<div class="swatch" style="background:${b.color}"></div><div>${b.label}</div>`;els.legendRows.appendChild(row)}}
function fitToDomain(){const d=state.catalog?.domain;if(d)map.fitBounds([[d.south,d.west],[d.north,d.east]],{padding:[30,30]})}
function milesBetween(lat1,lon1,lat2,lon2){const R=3958.8,toRad=x=>x*Math.PI/180,dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function nearestGridPoint(latlng){const grid=state.activeGrid;if(!grid)return null;let best=null,bestD2=Infinity;for(let i=0;i<grid.value.length;i++){const dLat=grid.lat[i]-latlng.lat,dLon=(grid.lon[i]-latlng.lng)*Math.cos(latlng.lat*Math.PI/180),d2=dLat*dLat+dLon*dLon;if(d2<bestD2){bestD2=d2;best=i}}if(best===null)return null;return{lat:grid.lat[best],lon:grid.lon[best],value:grid.value[best],distanceMiles:milesBetween(latlng.lat,latlng.lng,grid.lat[best],grid.lon[best])}}
map.on('click',e=>{const p=nearestGridPoint(e.latlng);if(!p||!state.activeLayer)return;els.sampleValue.textContent=`${p.value.toFixed(2)} in`;els.sampleDetail.innerHTML=`Nearest HREF grid point<br><strong>${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}</strong><br>${p.distanceMiles.toFixed(1)} miles from click<br>${layerLabel(state.activeLayer)}`});
els.layerSelect.addEventListener('change',()=>setActiveLayer(els.layerSelect.value));els.productSelect.addEventListener('change',chooseLayerFromFilters);els.accumSelect.addEventListener('change',chooseLayerFromFilters);els.fhourSelect.addEventListener('change',chooseLayerFromFilters);els.displaySelect.addEventListener('change',()=>{state.displayMode=els.displaySelect.value;qpfLayer.redraw()});els.opacitySlider.addEventListener('input',()=>{state.opacity=Number(els.opacitySlider.value);qpfLayer.redraw()});els.fitBtn.addEventListener('click',fitToDomain);
async function init(){try{const catalog=await fetch('data/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});state.catalog=catalog;if(!catalog.layers||catalog.layers.length===0){els.status.innerHTML='<span style="color:var(--danger);font-weight:800">No layers yet.</span><br>Run the GitHub Action first.';return}populateControls();drawLegend();map.whenReady(()=>{map.invalidateSize(true);fitToDomain()});setTimeout(()=>{map.invalidateSize(true);qpfLayer.redraw()},250);await setActiveLayer(catalog.defaultLayerId||catalog.layers[0].id)}catch(err){console.error(err);els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">No data catalog found yet.</span><br>Run the GitHub Action first. Error: ${err.message}`}finally{els.loading.classList.add('hidden')}}
init();
</script>
</body>
</html>
