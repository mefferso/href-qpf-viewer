<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HREF 6-Hour Max QPF Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--panel:rgba(13,17,23,.92);--panel2:rgba(22,27,34,.94);--text:#e6edf3;--muted:#9aa4b2;--line:rgba(255,255,255,.13);--danger:#ff7b72}html,body,#map{height:100%;width:100%;margin:0;padding:0;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#dde5ea;color:var(--text)}#map{position:fixed;inset:0}.top-panel,.readout,.legend,.loading,.maxbox{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:16px}.top-panel{top:14px;left:14px;width:min(420px,calc(100vw - 28px))}.controls{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 16px 14px}.header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}.title{font-size:18px;font-weight:800}.subtitle{margin-top:4px;color:var(--muted);font-size:12px}.readout{right:14px;top:14px;width:min(320px,calc(100vw - 28px))}.readout .box,.maxbox .box{padding:13px 15px}.big-number{font-size:34px;font-weight:900}.maxbox{left:14px;bottom:24px;width:min(320px,calc(100vw - 28px))}.legend{right:14px;bottom:24px;width:min(300px,calc(100vw - 28px));padding:12px 14px}.legend-row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px;font-size:12px;margin:4px 0}.swatch{height:13px;border-radius:4px}.loading{left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-weight:800}.hidden{display:none}select,input,button{width:100%;box-sizing:border-box;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}button{margin-top:4px;font-weight:800;cursor:pointer}label{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:4px}.checkrow{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.checkrow input{width:auto}.checkrow span{font-size:13px;font-weight:800}.contour-canvas{position:absolute;pointer-events:none;z-index:450}.max-dot-label{font-weight:900}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading" class="loading">Loading HREF Max QPF...</div>
<section class="top-panel">
<div class="header">
<div class="title">HREF 6-Hour Max QPF Viewer</div>
<div class="subtitle">True 6-hour Max QPF ending every 6 forecast hours.</div>
</div>
<div class="controls">
<div><label for="timeSelect">Forecast Period</label><select id="timeSelect"></select></div>
<div><label for="opacitySlider">QPF Opacity</label><input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="0.74" /></div>
<label class="checkrow"><input id="contourToggle" type="checkbox" /><span>Show legend-matched contours</span></label>
<div><button id="prevBtn">◀ Previous</button><button id="nextBtn">Next ▶</button></div>
</div>
<div id="status" style="padding:10px 16px;color:var(--muted)">Loading catalog...</div>
</section>
<section class="readout"><div class="box"><div class="big-number" id="sampleValue">-</div><div id="sampleDetail">Move over the map for QPF.</div></div></section>
<section class="maxbox"><div class="box"><div style="color:var(--muted);font-size:11px;font-weight:800">Layer Max</div><div id="maxValue" class="big-number">-</div><div id="maxDetail"></div></div></section>
<section class="legend"><div style="font-size:12px;font-weight:800;margin-bottom:8px">QPF Inches</div><div id="legendRows"></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const state={catalog:null,activeLayer:null,valueGrid:null,rasterLayer:null,maxMarker:null,contourCanvas:null,stateOutlineLayer:null,contoursOn:false,opacity:.74,lastLatLng:null};
const map=L.map('map').setView([30.1,-90.2],6);
map.createPane('statePane');
map.getPane('statePane').style.zIndex=520;
map.getPane('statePane').style.pointerEvents='none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png',{maxZoom:18,subdomains:'abcd'}).addTo(map);
const els={loading,status,timeSelect,opacitySlider,contourToggle,prevBtn,nextBtn,sampleValue,sampleDetail,maxValue,maxDetail,legendRows};
function fmtUTC(iso){const d=new Date(iso);return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}Z`;}
function fillTimes(){els.timeSelect.innerHTML='';for(const l of state.catalog.layers){const o=document.createElement('option');o.value=l.id;o.textContent=`${l.periodLabel} ending ${fmtUTC(l.validTimeUTC)}`;els.timeSelect.appendChild(o)}}
async function loadJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status} loading ${url}`);if(url.endsWith('.gz')){const ds=new DecompressionStream('gzip');return JSON.parse(await new Response(r.body.pipeThrough(ds)).text())}return await r.json()}
function drawLegend(){els.legendRows.innerHTML='';for(const b of state.catalog.colorScale){const row=document.createElement('div');row.className='legend-row';row.innerHTML=`<div class="swatch" style="background:${b.color}"></div><div>${b.label}</div>`;els.legendRows.appendChild(row)}}
async function loadStateOutlines(){try{const url='https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json';const gj=await fetch(url,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});const keep=new Set(['Louisiana','Mississippi','Alabama','Texas','Arkansas','Tennessee','Florida','Georgia']);state.stateOutlineLayer=L.geoJSON(gj,{pane:'statePane',interactive:false,filter:f=>keep.has(f?.properties?.name),style:{color:'rgba(5,10,18,.88)',weight:3.2,opacity:.9,fillOpacity:0,lineCap:'round',lineJoin:'round'}}).addTo(map)}catch(e){console.warn('State outline overlay failed:',e)}}
async function setLayer(id){const layer=state.catalog.layers.find(x=>x.id===id);const grid=await loadJson(layer.valueGridUrl);state.activeLayer=layer;state.valueGrid=grid;if(state.rasterLayer)map.removeLayer(state.rasterLayer);const b=layer.rasterBounds;state.rasterLayer=L.imageOverlay(layer.rasterUrl,[[b.south,b.west],[b.north,b.east]],{opacity:state.opacity}).addTo(map);placeMaxMarker();drawContours();if(state.lastLatLng)sample(state.lastLatLng);}
function overlayPoints(){const g=state.valueGrid;const layer=state.activeLayer;if(!g||!layer)return null;const b=layer.rasterBounds||g.bounds;const nw=map.latLngToLayerPoint([b.north,b.west]);const se=map.latLngToLayerPoint([b.south,b.east]);return {nw,se,width:se.x-nw.x,height:se.y-nw.y};}
function rasterPixelForLatLng(latlng){const g=state.valueGrid;const pts=overlayPoints();if(!g||!pts)return null;const p=map.latLngToLayerPoint(latlng);const fx=(p.x-pts.nw.x)/pts.width;const fy=(p.y-pts.nw.y)/pts.height;if(fx<0||fx>1||fy<0||fy>1)return null;const x=Math.round(fx*(g.width-1));const y=Math.round(fy*(g.height-1));if(x<0||y<0||x>=g.width||y>=g.height)return null;return {x,y};}
function latLngForRasterPixel(x,y){const g=state.valueGrid;const pts=overlayPoints();if(!g||!pts)return null;const fx=x/(g.width-1);const fy=y/(g.height-1);return map.layerPointToLatLng(L.point(pts.nw.x+fx*pts.width,pts.nw.y+fy*pts.height));}
function gridValueAt(x,y){const g=state.valueGrid;if(!g)return NaN;const raw=g.values[y*g.width+x];if(raw===g.missing||raw<-1000)return NaN;return Number(raw);}
function displayGridMax(){const g=state.valueGrid;if(!g)return null;let best=-Infinity,bx=0,by=0;for(let y=0;y<g.height;y++){const off=y*g.width;for(let x=0;x<g.width;x++){const raw=g.values[off+x];if(raw===g.missing||raw<-1000)continue;const v=Number(raw);if(Number.isFinite(v)&&v>best){best=v;bx=x;by=y;}}}return Number.isFinite(best)?{value:best,x:bx,y:by}:null;}
function placeMaxMarker(){if(state.maxMarker){map.removeLayer(state.maxMarker);state.maxMarker=null}const m=displayGridMax();if(!m)return;const ll=latLngForRasterPixel(m.x,m.y);if(!ll)return;state.maxMarker=L.circleMarker(ll,{radius:7,color:'#111',weight:3,fillColor:'#fff',fillOpacity:1}).addTo(map).bindTooltip(`Max ${m.value.toFixed(2)} in`,{className:'max-dot-label',direction:'top'});els.maxValue.textContent=`${m.value.toFixed(2)} in`;els.maxDetail.innerHTML=`${state.activeLayer.periodLabel}<br>Ending ${fmtUTC(state.activeLayer.validTimeUTC)}<br>${ll.lat.toFixed(3)}, ${ll.lng.toFixed(3)}`;}
function sample(latlng){state.lastLatLng=latlng;const g=state.valueGrid;if(!g||!g.bounds)return;const pix=rasterPixelForLatLng(latlng);if(!pix){els.sampleValue.textContent='-';els.sampleDetail.textContent='Outside QPF raster';return}const v=gridValueAt(pix.x,pix.y);if(!Number.isFinite(v)){els.sampleValue.textContent='-';els.sampleDetail.textContent='No data at cursor';return}els.sampleValue.textContent=`${v.toFixed(2)} in`;els.sampleDetail.innerHTML=`Overlay-pixel sample<br>${latlng.lat.toFixed(3)}, ${latlng.lng.toFixed(3)}<br>pixel ${pix.x}, ${pix.y}`;}
function ensureContourCanvas(){if(state.contourCanvas)return state.contourCanvas;const c=L.DomUtil.create('canvas','contour-canvas');map.getPanes().overlayPane.appendChild(c);state.contourCanvas=c;return c;}
function contourLevels(){return (state.catalog.colorScale||[]).slice(1).map(b=>({value:Number(b.min),color:b.color,label:b.label})).filter(x=>Number.isFinite(x.value)&&x.value>0);}
function drawSegment(ctx,a,b,scaleX,scaleY,color){ctx.beginPath();ctx.moveTo(a.x*scaleX,a.y*scaleY);ctx.lineTo(b.x*scaleX,b.y*scaleY);ctx.strokeStyle='rgba(0,0,0,.72)';ctx.lineWidth=3.2;ctx.stroke();ctx.beginPath();ctx.moveTo(a.x*scaleX,a.y*scaleY);ctx.lineTo(b.x*scaleX,b.y*scaleY);ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.stroke();}
function edgePoint(edge,x,y,v00,v10,v11,v01,t){let f=0;function frac(a,b){const d=b-a;return Math.abs(d)<1e-9?0.5:(t-a)/d}if(edge==='top'){f=frac(v00,v10);return{x:x+f,y:y}}if(edge==='right'){f=frac(v10,v11);return{x:x+1,y:y+f}}if(edge==='bottom'){f=frac(v01,v11);return{x:x+f,y:y+1}}f=frac(v00,v01);return{x:x,y:y+f}}
function drawContours(){const c=ensureContourCanvas();if(!state.contoursOn||!state.valueGrid||!state.activeLayer){c.style.display='none';return}const g=state.valueGrid;const pts=overlayPoints();if(!pts){c.style.display='none';return}const w=Math.max(1,Math.round(pts.width));const h=Math.max(1,Math.round(pts.height));c.style.display='block';c.width=w;c.height=h;c.style.width=`${w}px`;c.style.height=`${h}px`;L.DomUtil.setPosition(c,pts.nw);const ctx=c.getContext('2d');ctx.clearRect(0,0,w,h);ctx.lineCap='round';ctx.lineJoin='round';const scaleX=w/(g.width-1);const scaleY=h/(g.height-1);const vals=g.values,miss=g.missing;for(const level of contourLevels()){const t=level.value;for(let y=0;y<g.height-1;y++){const row=y*g.width,next=(y+1)*g.width;for(let x=0;x<g.width-1;x++){const v00=Number(vals[row+x]),v10=Number(vals[row+x+1]),v01=Number(vals[next+x]),v11=Number(vals[next+x+1]);if(v00===miss||v10===miss||v01===miss||v11===miss||v00<-1000||v10<-1000||v01<-1000||v11<-1000)continue;const edges=[];if((v00<t)!=(v10<t))edges.push('top');if((v10<t)!=(v11<t))edges.push('right');if((v01<t)!=(v11<t))edges.push('bottom');if((v00<t)!=(v01<t))edges.push('left');if(edges.length<2)continue;const pts2=edges.map(e=>edgePoint(e,x,y,v00,v10,v11,v01,t));if(pts2.length===2){drawSegment(ctx,pts2[0],pts2[1],scaleX,scaleY,level.color)}else if(pts2.length===4){drawSegment(ctx,pts2[0],pts2[1],scaleX,scaleY,level.color);drawSegment(ctx,pts2[2],pts2[3],scaleX,scaleY,level.color)}}}}
}
map.on('mousemove',e=>sample(e.latlng));
map.on('zoomend moveend resize',()=>{placeMaxMarker();drawContours();if(state.lastLatLng)sample(state.lastLatLng)});
els.timeSelect.addEventListener('change',()=>setLayer(els.timeSelect.value));
els.contourToggle.addEventListener('change',()=>{state.contoursOn=els.contourToggle.checked;drawContours()});
els.opacitySlider.addEventListener('input',()=>{state.opacity=Number(els.opacitySlider.value);if(state.rasterLayer)state.rasterLayer.setOpacity(state.opacity)});
function step(d){const layers=state.catalog.layers;const i=layers.findIndex(x=>x.id===state.activeLayer.id);const n=Math.max(0,Math.min(layers.length-1,i+d));setLayer(layers[n].id);els.timeSelect.value=layers[n].id}
els.prevBtn.onclick=()=>step(-1);els.nextBtn.onclick=()=>step(1);
(async()=>{try{loadStateOutlines();const c=await fetch('data/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});state.catalog=c;fillTimes();drawLegend();await setLayer(c.defaultLayerId||c.layers[0].id);loading.classList.add('hidden');}catch(e){loading.classList.add('hidden');status.innerHTML=`<span style="color:var(--danger);font-weight:800">Failed to load data.</span><br>${e.message}`;console.error(e)}})();
</script>
</body>
</html>
