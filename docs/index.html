<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HREF QPF Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--panel:rgba(13,17,23,.93);--panel2:rgba(22,27,34,.96);--text:#e6edf3;--muted:#9aa4b2;--line:rgba(255,255,255,.13);--danger:#ff7b72}html,body,#map{height:100%;width:100%;margin:0;padding:0;overflow:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#11141a;color:var(--text)}#map{position:fixed;inset:0;background:#11141a}.leaflet-container{background:#11141a!important}.top-panel,.readout,.legend,.loading{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}.top-panel{top:14px;left:14px;width:min(440px,calc(100vw - 28px))}.header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(47,129,247,.28),rgba(13,17,23,0))}.title{font-size:18px;font-weight:800;line-height:1.15}.subtitle{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 14px}.control.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}select,input[type=range],button{width:100%;box-sizing:border-box}select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;outline:none}button{cursor:pointer;font-weight:700}.status{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.45}.status strong{color:var(--text)}.readout{right:14px;top:14px;width:min(350px,calc(100vw - 28px))}.readout .box{padding:13px 15px}.big-number{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff}.readout-detail{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5}.legend{right:14px;bottom:24px;width:min(330px,calc(100vw - 28px));padding:12px 14px}.legend-title{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.08em;margin-bottom:8px}.legend-row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px;font-size:12px;margin:4px 0}.swatch{height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}.loading{z-index:2000;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-weight:800}.hidden{display:none}@media(max-width:760px){.readout{top:auto;bottom:24px}.legend{display:none}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading" class="loading">Loading HREF QPF...</div>
<section class="top-panel"><div class="header"><div class="title">HREF QPF Viewer</div><div class="subtitle">Raster HREF QPF overlay with aligned cursor/click sampling.</div></div><div class="controls"><div class="control full"><label for="layerSelect">Layer</label><select id="layerSelect"></select></div><div class="control"><label for="productSelect">Product</label><select id="productSelect"></select></div><div class="control"><label for="accumSelect">Accumulation</label><select id="accumSelect"></select></div><div class="control"><label for="fhourSelect">Forecast hour</label><select id="fhourSelect"></select></div><div class="control"><label for="opacitySlider">Opacity</label><input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="0.82" /></div><div class="control full"><button id="fitBtn">Fit map to data domain</button></div></div><div id="status" class="status">Waiting on data catalog...</div></section>
<section class="readout"><div class="box"><div class="big-number" id="sampleValue">-</div><div class="readout-detail" id="sampleDetail">Move over the map for a QPF value. Click to freeze/unfreeze.</div></div></section>
<section class="legend"><div class="legend-title">QPF inches</div><div id="legendRows"></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const state={catalog:null,activeLayer:null,activeGrid:null,valueGrid:null,rasterLayer:null,opacity:.82,frozen:false};
const els={loading:loading,layerSelect:layerSelect,productSelect:productSelect,accumSelect:accumSelect,fhourSelect:fhourSelect,opacitySlider:opacitySlider,fitBtn:fitBtn,status:status,sampleValue:sampleValue,sampleDetail:sampleDetail,legendRows:legendRows};
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([30.1,-90.2],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png',{maxZoom:18,subdomains:'abcd',attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
function uniqueSorted(arr,numeric=false){const vals=Array.from(new Set(arr.filter(v=>v!==null&&v!==undefined)));vals.sort((a,b)=>numeric?Number(a)-Number(b):String(a).localeCompare(String(b)));return vals}
function layerLabel(layer){const valid=layer.validTimeUTC?new Date(layer.validTimeUTC).toISOString().slice(0,16).replace('T',' ')+'Z':'valid time unknown';return `${layer.runLabel} - ${layer.productLabel} - ${layer.accumHours}h QPF - F${String(layer.forecastHour).padStart(2,'0')} - ${valid}`}
function fillSelect(select,values,labeler=v=>v,selected=null){select.innerHTML='';for(const v of values){const opt=document.createElement('option');opt.value=String(v);opt.textContent=labeler(v);if(selected!==null&&String(v)===String(selected))opt.selected=true;select.appendChild(opt)}}
function populateControls(){const layers=state.catalog.layers||[];fillSelect(els.layerSelect,layers.map(l=>l.id),id=>layerLabel(layers.find(l=>l.id===id)));fillSelect(els.productSelect,uniqueSorted(layers.map(l=>l.product)),code=>layers.find(l=>l.product===code)?.productLabel||code);fillSelect(els.accumSelect,uniqueSorted(layers.map(l=>l.accumHours),true),h=>`${h} hours`);fillSelect(els.fhourSelect,uniqueSorted(layers.map(l=>l.forecastHour),true),h=>`F${String(h).padStart(2,'0')}`)}
function syncFilterControls(layer){els.productSelect.value=layer.product;els.accumSelect.value=String(layer.accumHours);els.fhourSelect.value=String(layer.forecastHour);els.layerSelect.value=layer.id}
async function loadMaybeGzipJson(url){const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status} for ${url}`);if(url.endsWith('.gz')){if(!('DecompressionStream'in window))throw new Error('This browser cannot read gzip data files. Use current Chrome/Edge.');const ds=new DecompressionStream('gzip');const text=await new Response(res.body.pipeThrough(ds)).text();return JSON.parse(text)}return await res.json()}
function setRasterLayer(layer){if(state.rasterLayer){map.removeLayer(state.rasterLayer);state.rasterLayer=null}if(!layer.rasterUrl||!layer.rasterBounds)return;const b=layer.rasterBounds;state.rasterLayer=L.imageOverlay(layer.rasterUrl,[[b.south,b.west],[b.north,b.east]],{opacity:state.opacity,interactive:false}).addTo(map)}
function sampleAlignedValue(latlng){const g=state.valueGrid;if(!g||!g.bounds)return null;const b=g.bounds;if(latlng.lat<b.south||latlng.lat>b.north||latlng.lng<b.west||latlng.lng>b.east)return null;const x=(latlng.lng-b.west)/(b.east-b.west)*(g.width-1);const y=(b.north-latlng.lat)/(b.north-b.south)*(g.height-1);const xi=Math.round(x),yi=Math.round(y);if(xi<0||yi<0||xi>=g.width||yi>=g.height)return null;const idx=yi*g.width+xi;const v=g.values[idx];if(v===undefined||v===g.missing||v<-1000)return {value:0,missing:true,row:yi,col:xi};return {value:Number(v),missing:false,row:yi,col:xi}}
function updateReadout(latlng,mode='cursor'){const s=sampleAlignedValue(latlng);if(!s||!state.activeLayer){els.sampleValue.textContent='-';els.sampleDetail.innerHTML='Outside active QPF raster.';return}els.sampleValue.textContent=`${s.value.toFixed(2)} in`;const frozen=state.frozen?'Frozen click':'Cursor';const miss=s.missing?' Raster pixel has no precip/data; showing 0.00.':'';els.sampleDetail.innerHTML=`${frozen} aligned raster sample<br><strong>${latlng.lat.toFixed(3)}, ${latlng.lng.toFixed(3)}</strong><br>grid row ${s.row}, col ${s.col}${miss}<br>${layerLabel(state.activeLayer)}`}
async function setActiveLayer(layerId){const layer=state.catalog.layers.find(l=>l.id===layerId);if(!layer)return;els.loading.classList.remove('hidden');els.status.innerHTML=`Loading <strong>${layerLabel(layer)}</strong>...`;try{const grid=await loadMaybeGzipJson(layer.url);const valueGrid=layer.valueGridUrl?await loadMaybeGzipJson(layer.valueGridUrl):null;state.activeLayer=layer;state.activeGrid=grid;state.valueGrid=valueGrid;state.frozen=false;syncFilterControls(layer);setRasterLayer(layer);els.status.innerHTML=`<strong>${layerLabel(layer)}</strong><br>${layer.pointCount.toLocaleString()} fallback sample points. Raster max: ${layer.maxValue.toFixed(2)} in.`;els.sampleValue.textContent='-';els.sampleDetail.textContent='Move over the map for a QPF value. Click to freeze/unfreeze.'}catch(err){console.error(err);els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">Could not load layer.</span><br>${err.message}`}finally{els.loading.classList.add('hidden')}}
function chooseLayerFromFilters(){const product=els.productSelect.value,accum=Number(els.accumSelect.value),fhour=Number(els.fhourSelect.value);const layer=state.catalog.layers.find(l=>l.product===product&&l.accumHours===accum&&l.forecastHour===fhour);if(layer)setActiveLayer(layer.id);else els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">No exact layer for that combo.</span><br>Try a different accumulation or forecast hour.`}
function drawLegend(){els.legendRows.innerHTML='';for(const b of state.catalog.colorScale||[]){const row=document.createElement('div');row.className='legend-row';row.innerHTML=`<div class="swatch" style="background:${b.color}"></div><div>${b.label}</div>`;els.legendRows.appendChild(row)}}
function fitToDomain(){const d=state.activeLayer?.rasterBounds||state.catalog?.domain;if(d)map.fitBounds([[d.south,d.west],[d.north,d.east]],{padding:[30,30]})}
map.on('mousemove',e=>{if(!state.frozen)updateReadout(e.latlng,'cursor')});
map.on('click',e=>{state.frozen=!state.frozen;updateReadout(e.latlng,'click')});
els.layerSelect.addEventListener('change',()=>setActiveLayer(els.layerSelect.value));els.productSelect.addEventListener('change',chooseLayerFromFilters);els.accumSelect.addEventListener('change',chooseLayerFromFilters);els.fhourSelect.addEventListener('change',chooseLayerFromFilters);els.opacitySlider.addEventListener('input',()=>{state.opacity=Number(els.opacitySlider.value);if(state.rasterLayer)state.rasterLayer.setOpacity(state.opacity)});els.fitBtn.addEventListener('click',fitToDomain);
async function init(){try{const catalog=await fetch('data/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});state.catalog=catalog;if(!catalog.layers||catalog.layers.length===0){els.status.innerHTML='<span style="color:var(--danger);font-weight:800">No layers yet.</span><br>Run the GitHub Action first.';return}populateControls();drawLegend();map.whenReady(()=>{map.invalidateSize(true);fitToDomain()});await setActiveLayer(catalog.defaultLayerId||catalog.layers[0].id);setTimeout(()=>map.invalidateSize(true),250)}catch(err){console.error(err);els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">No data catalog found yet.</span><br>Run the GitHub Action first. Error: ${err.message}`}finally{els.loading.classList.add('hidden')}}init();
</script>
</body>
</html>
