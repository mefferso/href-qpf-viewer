<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HREF QPF Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--panel:rgba(13,17,23,.92);--panel2:rgba(22,27,34,.94);--text:#e6edf3;--muted:#9aa4b2;--line:rgba(255,255,255,.13);--danger:#ff7b72;--accent:#58a6ff}html,body,#map{height:100%;width:100%;margin:0;padding:0;overflow:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dde5ea;color:var(--text)}#map{position:fixed;inset:0;background:#dde5ea}.leaflet-container{background:#dde5ea!important}.top-panel,.readout,.legend,.loading,.maxbox{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.30);overflow:hidden}.top-panel{top:14px;left:14px;width:min(460px,calc(100vw - 28px))}.header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(47,129,247,.22),rgba(13,17,23,0))}.title{font-size:18px;font-weight:800;line-height:1.15}.subtitle{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 14px}.control.full{grid-column:1/-1}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}select,input[type=range],button{width:100%;box-sizing:border-box}select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;outline:none}button{cursor:pointer;font-weight:800}button:hover,select:hover{border-color:rgba(88,166,255,.75)}.status{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.45}.status strong{color:var(--text)}.readout{right:14px;top:14px;width:min(350px,calc(100vw - 28px))}.readout .box,.maxbox .box{padding:13px 15px}.big-number{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff}.readout-detail,.max-detail{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5}.maxbox{left:14px;bottom:24px;width:min(330px,calc(100vw - 28px))}.max-title{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.max-value{font-size:28px;font-weight:900;color:#fff;line-height:1.1;margin-top:3px}.legend{right:14px;bottom:24px;width:min(330px,calc(100vw - 28px));padding:12px 14px}.legend-title{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.08em;margin-bottom:8px}.legend-row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px;font-size:12px;margin:4px 0}.swatch{height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}.loading{z-index:2000;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-weight:800}.hidden{display:none}.leaflet-pane.qpf-pane{z-index:350}.leaflet-pane.label-pane{z-index:650;pointer-events:none}@media(max-width:760px){.readout{top:auto;bottom:24px}.legend,.maxbox{display:none}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading" class="loading">Loading HREF QPF...</div>
<section class="top-panel"><div class="header"><div class="title">HREF QPF Viewer</div><div class="subtitle">Pick product, then step through valid/end times. Cursor readout samples the same grid used by the raster.</div></div><div class="controls"><div class="control"><label for="productSelect">Product</label><select id="productSelect"></select></div><div class="control"><label for="timeSelect">Valid/end time</label><select id="timeSelect"></select></div><div class="control"><label for="baseSelect">Map</label><select id="baseSelect"><option value="light" selected>Light map</option><option value="voyager">Detailed map</option><option value="dark">Dark map</option></select></div><div class="control"><label for="opacitySlider">QPF opacity</label><input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="0.74" /></div><div class="control full"><div class="button-row"><button id="prevBtn">◀ Previous time</button><button id="nextBtn">Next time ▶</button></div></div><div class="control full"><button id="fitBtn">Fit map to data domain</button></div></div><div id="status" class="status">Waiting on data catalog...</div></section>
<section class="readout"><div class="box"><div class="big-number" id="sampleValue">-</div><div class="readout-detail" id="sampleDetail">Move over the map for a QPF value. Click to freeze/unfreeze.</div></div></section>
<section class="maxbox"><div class="box"><div class="max-title">Layer max QPF</div><div class="max-value" id="maxValue">-</div><div class="max-detail" id="maxDetail">Waiting on layer...</div></div></section>
<section class="legend"><div class="legend-title">QPF inches</div><div id="legendRows"></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const state={catalog:null,activeLayer:null,valueGrid:null,rasterLayer:null,maxMarker:null,opacity:.74,frozen:false,baseLayer:null,labelLayer:null,currentBase:'light'};
const els={loading:loading,productSelect:productSelect,timeSelect:timeSelect,baseSelect:baseSelect,opacitySlider:opacitySlider,fitBtn:fitBtn,prevBtn:prevBtn,nextBtn:nextBtn,status:status,sampleValue:sampleValue,sampleDetail:sampleDetail,legendRows:legendRows,maxValue:maxValue,maxDetail:maxDetail};
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([30.1,-90.2],6);
map.createPane('qpfPane');map.getPane('qpfPane').classList.add('qpf-pane');map.createPane('labelPane');map.getPane('labelPane').classList.add('label-pane');
const BASES={light:{base:'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png',labels:'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}.png'},voyager:{base:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}.png',labels:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}.png'},dark:{base:'https://{s}.basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}.png',labels:'https://{s}.basemaps.cartocdn.com/rastertiles/dark_only_labels/{z}/{x}/{y}.png'}};
function setBaseMap(name){if(state.baseLayer)map.removeLayer(state.baseLayer);if(state.labelLayer)map.removeLayer(state.labelLayer);state.currentBase=name;const cfg=BASES[name]||BASES.light;state.baseLayer=L.tileLayer(cfg.base,{maxZoom:18,subdomains:'abcd',attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);state.labelLayer=L.tileLayer(cfg.labels,{maxZoom:18,subdomains:'abcd',pane:'labelPane'}).addTo(map)}
setBaseMap('light');
function fmtValid(layer){return layer.validTimeUTC?new Date(layer.validTimeUTC).toISOString().slice(0,16).replace('T',' ')+'Z':'valid time unknown'}
function productName(code){const l=(state.catalog?.layers||[]).find(x=>x.product===code);return l?.productLabel||code}
function layerLabel(layer){return `${layer.productLabel} - ${layer.periodLabel||layer.accumHours+'h QPF'} - valid/end ${fmtValid(layer)}`}
function periodText(layer){return `${layer.periodLabel||layer.accumHours+'h QPF'} - valid/end ${fmtValid(layer)}`}
function comparableLayers(){const p=els.productSelect.value;return (state.catalog?.layers||[]).filter(l=>l.product===p).sort((a,b)=>(a.stepEnd-b.stepEnd)||(a.accumHours-b.accumHours)||String(a.id).localeCompare(String(b.id)))}
function fillSelect(select,values,labeler=v=>v,selected=null){select.innerHTML='';for(const v of values){const opt=document.createElement('option');opt.value=String(v);opt.textContent=labeler(v);if(selected!==null&&String(v)===String(selected))opt.selected=true;select.appendChild(opt)}}
function populateControls(){const layers=state.catalog.layers||[];fillSelect(els.productSelect,Array.from(new Set(layers.map(l=>l.product))),code=>productName(code));syncTimeSelect()}
function syncTimeSelect(selectedId=null){const layers=comparableLayers();fillSelect(els.timeSelect,layers.map(l=>l.id),id=>periodText(layers.find(l=>l.id===id)),selectedId||layers[0]?.id)}
async function loadMaybeGzipJson(url){const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status} for ${url}`);if(url.endsWith('.gz')){if(!('DecompressionStream'in window))throw new Error('This browser cannot read gzip data files. Use current Chrome/Edge.');const ds=new DecompressionStream('gzip');const text=await new Response(res.body.pipeThrough(ds)).text();return JSON.parse(text)}return await res.json()}
function setRasterLayer(layer){if(state.rasterLayer){map.removeLayer(state.rasterLayer);state.rasterLayer=null}const b=layer.rasterBounds;state.rasterLayer=L.imageOverlay(layer.rasterUrl,[[b.south,b.west],[b.north,b.east]],{opacity:state.opacity,interactive:false,pane:'qpfPane'}).addTo(map)}
function setMaxDisplay(layer){if(state.maxMarker){map.removeLayer(state.maxMarker);state.maxMarker=null}const mp=layer.maxPoint;els.maxValue.textContent=Number.isFinite(mp?.value)?`${mp.value.toFixed(2)} in`:'-';els.maxDetail.innerHTML=Number.isFinite(mp?.lat)?`${layerLabel(layer)}<br><strong>${mp.lat.toFixed(3)}, ${mp.lon.toFixed(3)}</strong>`:layerLabel(layer);if(Number.isFinite(mp?.lat)&&Number.isFinite(mp?.lon)){state.maxMarker=L.circleMarker([mp.lat,mp.lon],{radius:7,color:'#111',weight:3,fillColor:'#ffd43b',fillOpacity:.95,pane:'markerPane'}).addTo(map).bindTooltip(`Max ${mp.value.toFixed(2)} in`,{permanent:false,direction:'top'})}}
function sampleAlignedValue(latlng){const g=state.valueGrid;if(!g||!g.bounds)return null;const b=g.bounds;if(latlng.lat<b.south||latlng.lat>b.north||latlng.lng<b.west||latlng.lng>b.east)return null;const x=(latlng.lng-b.west)/(b.east-b.west)*(g.width-1);const y=(b.north-latlng.lat)/(b.north-b.south)*(g.height-1);const xi=Math.round(x),yi=Math.round(y);if(xi<0||yi<0||xi>=g.width||yi>=g.height)return null;const v=g.values[yi*g.width+xi];if(v===undefined||v===g.missing||v<-1000)return {value:0,missing:true,row:yi,col:xi};return {value:Number(v),missing:false,row:yi,col:xi}}
function updateReadout(latlng){const s=sampleAlignedValue(latlng);if(!s||!state.activeLayer){els.sampleValue.textContent='-';els.sampleDetail.innerHTML='Outside active QPF raster.';return}els.sampleValue.textContent=`${s.value.toFixed(2)} in`;const frozen=state.frozen?'Frozen click':'Cursor';const miss=s.missing?' No precip/data pixel; showing 0.00.':'';els.sampleDetail.innerHTML=`${frozen} aligned raster sample<br><strong>${latlng.lat.toFixed(3)}, ${latlng.lng.toFixed(3)}</strong><br>row ${s.row}, col ${s.col}${miss}<br>${layerLabel(state.activeLayer)}`}
async function setActiveLayer(layerId){const layer=state.catalog.layers.find(l=>l.id===layerId);if(!layer)return;els.loading.classList.remove('hidden');els.status.innerHTML=`Loading <strong>${layerLabel(layer)}</strong>...`;try{const valueGrid=await loadMaybeGzipJson(layer.valueGridUrl);state.activeLayer=layer;state.valueGrid=valueGrid;state.frozen=false;els.productSelect.value=layer.product;syncTimeSelect(layer.id);setRasterLayer(layer);setMaxDisplay(layer);els.status.innerHTML=`<strong>${layerLabel(layer)}</strong><br>Run ${layer.runLabel}. Raster max: ${layer.maxValue.toFixed(2)} in. Use ◀/▶ or keyboard arrows to step times.`;els.sampleValue.textContent='-';els.sampleDetail.textContent='Move over the map for a QPF value. Click to freeze/unfreeze.'}catch(err){console.error(err);els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">Could not load layer.</span><br>${err.message}`}finally{els.loading.classList.add('hidden')}}
function drawLegend(){els.legendRows.innerHTML='';for(const b of state.catalog.colorScale||[]){const row=document.createElement('div');row.className='legend-row';row.innerHTML=`<div class="swatch" style="background:${b.color}"></div><div>${b.label}</div>`;els.legendRows.appendChild(row)}}
function fitToDomain(){const d=state.activeLayer?.rasterBounds||state.catalog?.domain;if(d)map.fitBounds([[d.south,d.west],[d.north,d.east]],{padding:[30,30]})}
function stepTime(delta){const layers=comparableLayers();const idx=layers.findIndex(l=>l.id===state.activeLayer?.id);if(!layers.length)return;const next=Math.max(0,Math.min(layers.length-1,(idx<0?0:idx)+delta));setActiveLayer(layers[next].id)}
map.on('mousemove',e=>{if(!state.frozen)updateReadout(e.latlng)});map.on('click',e=>{state.frozen=!state.frozen;updateReadout(e.latlng)});
els.productSelect.addEventListener('change',()=>{syncTimeSelect();setActiveLayer(els.timeSelect.value)});els.timeSelect.addEventListener('change',()=>setActiveLayer(els.timeSelect.value));els.baseSelect.addEventListener('change',()=>setBaseMap(els.baseSelect.value));els.opacitySlider.addEventListener('input',()=>{state.opacity=Number(els.opacitySlider.value);if(state.rasterLayer)state.rasterLayer.setOpacity(state.opacity)});els.fitBtn.addEventListener('click',fitToDomain);els.prevBtn.addEventListener('click',()=>stepTime(-1));els.nextBtn.addEventListener('click',()=>stepTime(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')stepTime(-1);if(e.key==='ArrowRight')stepTime(1)});
async function init(){try{const catalog=await fetch('data/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});state.catalog=catalog;if(!catalog.layers||catalog.layers.length===0){els.status.innerHTML='<span style="color:var(--danger);font-weight:800">No layers yet.</span><br>Run the GitHub Action first.';return}populateControls();drawLegend();await setActiveLayer(catalog.defaultLayerId||catalog.layers[0].id);map.whenReady(()=>{map.invalidateSize(true);fitToDomain()});setTimeout(()=>map.invalidateSize(true),250)}catch(err){console.error(err);els.status.innerHTML=`<span style="color:var(--danger);font-weight:800">No data catalog found yet.</span><br>Run the GitHub Action first. Error: ${err.message}`}finally{els.loading.classList.add('hidden')}}init();
</script>
</body>
</html>
